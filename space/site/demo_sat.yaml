#
# Synthetic reference spacecraft for the space-domain intent schema and keep-out
# predictor (ADR 0012). Every angle is [PARAMETER TBD]; none is a measurement.
# The LLM may name boresight_id and target_id from this file and nothing else.

vehicle_id: demo-sat
description: Earth-pointing smallsat used by the M13c/M16 analytic tests.

boresights:
  instrument-a:
    description: Primary payload aperture.
    body_axis: [1.0, 0.0, 0.0]
    keepout_theta_min_rad: 0.35   # ~20 deg; [PARAMETER TBD]
  star-tracker-1:
    description: Star tracker, blinded by the sun or moon.
    body_axis: [0.0, 1.0, 0.0]
    keepout_theta_min_rad: 0.52   # ~30 deg; [PARAMETER TBD]

targets:
  nadir:
    description: Earth-pointing, the nominal science attitude.
  ground-station-1:
    description: Named ground station for a downlink pass.
  sun:
    description: Sun vector in inertial; never a legal slew target for instrument-a.

forbidden:
  sun:
    description: Bright-body keep-out used by attitude_keepout.
  moon:
    description: Secondary bright body.

limits:
  horizon_s: 30.0                 # predictor horizon; [PARAMETER TBD]
  max_slew_rate_rad_s: 0.05       # [PARAMETER TBD]

# ADR 0015 rules 2 and 3, as data. Changing the admissible set is a configuration change with
# a recorded hash, never a rebuild of the gateway predicate (ADR 0015 rule 2).
gateway:
  # Which intent verbs GuaraSpaceGateway admits in each arbiter state. A verb absent from the
  # state's list is refused; `status` is the only verb admissible while the safe-mode latch is
  # closed, and no verb here releases it (ADR 0012 decision 3, ADR 0015 rule 7).
  admissible:
    INACTIVE: [status, safe_mode, abort]
    CF: [slew, point_hold, safe_mode, abort, status]
    RF: [safe_mode, abort, status]
    LATCHED: [status]

  # Trusted time. Both are measured against the reception instant on the host clock; the time
  # system itself is [PARAMETER TBD] until AC-99 declares it (ADR 0015 rule 3).
  future_stamp_tolerance_s: 0.05
  proposal_timeout_s: 0.5
