# M7: injected monitor T3 → Hold, with RtaEvent/RtaState latency stamps (AC-18/19/22).
name: latency_hold
vehicle:
  simulator: sihsim
  model: sihsim_quadx
  speed_factor: 1
home:
  lat: -22.0087
  lon: -47.8909
  alt: 850.0
timeouts_s:
  boot: 60
  ready: 120
ros_nodes:
  - {package: guara_rta, executable: guara_rta_node, params_file: config/rta_params.yaml}
record_latency: true
steps:
  - {cmd: "commander takeoff", wait_until: airborne, timeout_s: 60}
  - {sleep_s: 3}
  - {user_nav_state: owned, wait_until: owned, timeout_s: 20}
  - {wait_rta: 1, timeout_s: 15}
  - {inject_verdict: {monitor_id: REQ-INJECT, duration_s: 3}}
  - {wait_until: loiter, timeout_s: 15}
  - {sleep_s: 3}
  - {cmd: "commander land", wait_until: disarmed, timeout_s: 90}
expect:
  min_altitude_m: 2.0
  nav_state_hold: AUTO_LOITER
