# SPDX-License-Identifier: Apache-2.0
# M3 AC-16 / FM-4: hang the decision callback group after CF; PX4 must leave owned mode (RTL).
name: hang_decision_thread
vehicle:
  simulator: sihsim
  model: sihsim_quadx
  speed_factor: 1
home:
  lat: -22.0087
  lon: -47.8909
  alt: 850.0
timeouts_s:
  boot: 60
  ready: 120
ros_nodes:
  - package: guara_rta
    executable: guara_rta_node
    params_file: config/rta_params.yaml
    params:
      fault_injection.hang_decision_after_s: 8.0
steps:
  - {cmd: "commander takeoff", wait_until: airborne, timeout_s: 60}
  - {sleep_s: 8}
  - {user_nav_state: owned, wait_until: owned, timeout_s: 20}
  - {wait_rta: 1, timeout_s: 15}
  - {wait_until: rtl, timeout_s: 20}
  - {sleep_s: 3}
expect:
  min_altitude_m: 2.0
  nav_state_after_hang: AUTO_RTL
