# SPDX-License-Identifier: Apache-2.0
# M3 AC-14 / FM-8: a user SET_NAV_STATE to AUTO_LOITER (GCS Hold) while the owned
# CF mode is active must deactivate the executor (T1 → INACTIVE); later monitor
# injections must not command. POSCTL is not used: SIH without RC rejects it.
name: pilot_override
vehicle:
  simulator: sihsim
  model: sihsim_quadx
  speed_factor: 1
home:
  lat: -22.0087
  lon: -47.8909
  alt: 850.0
timeouts_s:
  boot: 60
  ready: 120
ros_nodes:
  - {package: guara_rta, executable: guara_rta_node, params_file: config/rta_params.yaml}
steps:
  - {cmd: "commander takeoff", wait_until: airborne, timeout_s: 60}
  - {sleep_s: 8}
  - {user_nav_state: owned, wait_until: owned, timeout_s: 20}
  - {wait_rta: 1, timeout_s: 15}
  - {user_nav_state: 4, wait_until: loiter, timeout_s: 15}
  - {wait_rta: 0, timeout_s: 15}
  - {inject_verdict: {monitor_id: REQ-INJECT, duration_s: 2}}
  - {sleep_s: 2}
  - {cmd: "commander land", wait_until: disarmed, timeout_s: 90}
expect:
  min_altitude_m: 2.0
