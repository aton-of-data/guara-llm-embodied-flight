# SPDX-License-Identifier: Apache-2.0
#
# The checks that do not need PX4. The SITL scenarios, the latency batch and the monitor
# generation stay out of CI deliberately: they build PX4 from source and their results
# belong in results/ with a recorded seed and commit, not in a job log. Nothing here
# produces a number that may be cited (CLAUDE.md).
name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: mission and space layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install hash-pinned dependencies (AC-52)
        run: pip install --require-hashes -r requirements.lock
      - name: Install the tier-0 package
        run: pip install -e . --no-deps
      - name: Single pin source (versions.env; AC-52 / G-S2)
        run: python3 scripts/check_reproducible.py --pins
      - name: Workstation preflight (AC-51 / G-S5)
        run: guara doctor
      - name: C ABI symbol baseline (AC-61)
        run: python3 scripts/check_abi.py --baseline core/abi_symbols.txt
      - name: Mission compiler, corpus, plan executor, space keep-out
        run: python3 -m pytest scripts/tests -q
      - name: The no-container path the README promises
        run: |
          guara compile --intent mission/intents/survey_north_3.json
          ! guara compile --intent mission/intents/survey_north_3_out_of_envelope.json
          test "$(guara compile --stop 'land now')" = land_now
          test "$(guara compile --stop 'pouse agora')" = land_now
          python3 -m mission.compiler --stop 'land now' | grep -x land_now
          guara params check config/rta_params.yaml config/rta_params_flight.yaml
          guara ctk run --port python --report /tmp/guara-ctk-report
          python3 scripts/check_ac.py AC-66 /tmp/guara-ctk-report
          guara ctk run --port python --vectors core/conformance/vectors/adr0010_gateway.json
          ./scripts/ctk_mutation.sh

  core:
    name: host-free kernel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, test and consume guara-core (AC-55 / AC-57)
        run: ./scripts/check_core_consumer.sh
        shell: bash
        env:
          CMAKE_BUILD_TYPE: Release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: SIL port through the C ABI (AC-64)
        run: ./scripts/check_ctk_sil.sh
        shell: bash

  core-qa:
    name: kernel sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: |
          sudo apt-get update -y --quiet
          sudo apt-get install -y --quiet --no-install-recommends clang-tidy
      - name: ASan, UBSan and clang-tidy (AC-62)
        run: ./scripts/core_qa.sh --require-tidy

  boundaries:
    name: licence, headers and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: No NOSA-licensed code outside nosa/ (AC-11)
        run: python3 scripts/check_license_isolation.py
      - name: Every tracked source file carries an SPDX identifier
        run: python3 scripts/check_spdx.py
      - name: Every relative markdown link resolves
        run: python3 scripts/check_links.py

  cpp:
    name: geofence predictor and messages
    runs-on: ubuntu-latest
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install the test dependency the ROS base image does not carry
        run: |
          apt-get update -y --quiet
          apt-get install -y --quiet --no-install-recommends ros-humble-ament-cmake-gtest
          rm -rf /var/lib/apt/lists/*
      # colcon warns and carries on when --packages-select names something it did not
      # discover, and `colcon test-result` exits 0 on zero tests. A job that selected
      # nothing therefore reports success having built and tested nothing, so each step
      # below is asserted rather than trusted.
      - name: Show what colcon discovers
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon list --base-paths ros2_ws/src

      - name: Build and test the packages that need no PX4 sources
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          set -x
          colcon build --symlink-install --base-paths ros2_ws/src \
            --packages-select guara_msgs guara_geofence \
            --event-handlers console_direct+
          colcon test --base-paths ros2_ws/src \
            --packages-select guara_msgs guara_geofence \
            --event-handlers console_direct+
          colcon test-result --verbose | tee /tmp/test-result.txt

      - name: Refuse a vacuous pass
        shell: bash
        run: |
          for pkg in guara_msgs guara_geofence; do
            test -d "build/$pkg" || { echo "$pkg was never built" >&2; exit 1; }
          done
          total=$(sed -n 's/^Summary: \([0-9]\+\) tests.*/\1/p' /tmp/test-result.txt | tail -1)
          echo "tests run: ${total:-0}"
          if [ -z "$total" ] || [ "$total" -lt 1 ]; then
            echo "colcon reported no tests; the job built or selected nothing." >&2
            exit 1
          fi
