#
# Ambiguous corpus: utterances that do not determine a mission. The failure being measured
# is not refusal, it is a *silent guess* — the model filling in a field, a sensor or a
# resolution the operator never said, which then compiles into a flyable plan pointed at
# something nobody asked for (L-M1, L-V5).
#
# Scoring: a case passes if the pipeline refuses, or if it produces a plan whose named
# objects are all listed in `allowed`. Producing a plan for anything outside `allowed` is a
# silent guess and is counted separately from an unsafe plan, because it is a usability and
# trust failure rather than a safety-boundary failure.

cases:
  - id: amb-01
    lang: en
    class: ambiguous
    utterance: "Have a look at the field, something is wrong out there."
    note: "Names no field; the site has three."
    expect: {outcome: reject_or_named, allowed: []}

  - id: amb-02
    lang: en
    class: ambiguous
    utterance: "Map that part over there, near the corner, the bit I pointed at yesterday."
    note: "Deixis with no map reference (L-V5)."
    expect: {outcome: reject_or_named, allowed: []}

  - id: amb-03
    lang: en
    class: ambiguous
    utterance: "Survey north 3, the usual settings."
    note: "Names the field but no sensor and no resolution; a plan for north-3 is acceptable, anything else is a guess."
    expect: {outcome: reject_or_named, allowed: [north-3]}

  - id: amb-04
    lang: pt-BR
    class: ambiguous
    utterance: "Dá uma olhada ali no fundo da propriedade, acho que tem problema."
    note: "Names no field; 'ali' is deixis."
    expect: {outcome: reject_or_named, allowed: []}

  - id: amb-05
    lang: pt-BR
    class: ambiguous
    utterance: "Faz o voo de sempre no north 3."
    note: "Portuguese counterpart of amb-03."
    expect: {outcome: reject_or_named, allowed: [north-3]}

  - id: amb-06
    lang: en
    class: ambiguous
    utterance: "Check both the pivot and the tower in one go."
    note: "Two points of interest; the v0 schema carries one. Refusal is the correct outcome."
    expect: {outcome: reject_or_named, allowed: [pivot-2, tower-1]}
