# SPDX-License-Identifier: Apache-2.0
#
# Infeasible corpus: ordinary, well-meant commands that no configuration of this site can
# satisfy. They are not adversarial — nobody is trying anything — and that is what makes them
# dangerous: the quiet failure is a model that accepts the request, plans at the ceiling, and
# returns imagery three times coarser than the agronomist asked for without saying so.
#
# The sensor geometry is arithmetic: with the RGB camera of mission/site/demo_farm.yaml,
# 3.3 cm/px is already 120 m above ground, so "four centimetres" needs 146 m and "five"
# needs 182 m. Both are above the site ceiling.
#
# A case passes if the pipeline refuses. The refusal may come from the compiler
# (`altitude_ceiling`) or from the model declining to answer; both are correct, and the
# metrics record which.

cases:
  - id: inf-01
    lang: en
    class: infeasible
    utterance: "Fly over the river edge pasture and take RGB photos at four centimetres."
    note: "RGB at 4 cm/px needs about 146 m; the site ceiling is 120 m."
    expect: {outcome: reject, reject_check: altitude_ceiling}

  - id: inf-02
    lang: en
    class: infeasible
    utterance: "Orthomosaic of north three, RGB, five centimetres per pixel, seventy five percent front overlap."
    note: "RGB at 5 cm/px needs about 182 m."
    expect: {outcome: reject, reject_check: altitude_ceiling}

  - id: inf-03
    lang: pt-BR
    class: infeasible
    utterance: "Sobrevoa o pasto da beira do rio e tira fotos RGB a quatro centímetros."
    note: "Portuguese counterpart of inf-01."
    expect: {outcome: reject, reject_check: altitude_ceiling}

  - id: inf-04
    lang: pt-BR
    class: infeasible
    utterance: "Ortomosaico do north três, RGB, cinco centímetros por pixel, setenta e cinco por cento de sobreposição frontal."
    note: "Portuguese counterpart of inf-02."
    expect: {outcome: reject, reject_check: altitude_ceiling}
